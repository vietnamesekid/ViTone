[project]
name = "vitone"
version = "0.0.1"
description = "Open conversational speech model for Vietnamese"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The ViTone Authors" }]
keywords = ["text-to-speech", "conversational-speech", "vietnamese", "speech-data"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: Vietnamese",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "av>=14",
    "lhotse>=1.30",
    "numpy>=1.26",
    "pyyaml>=6.0.1",  # 6.0 has no wheels for Python >= 3.11
    "scipy>=1.11",  # Lhotse resampling backend without torchaudio
    "soundfile>=0.12",
    "tqdm>=4.66",
    "urllib3>=2",  # lhotse>=1.33 imports it without declaring it
]

[project.optional-dependencies]
# Model-based stages. Each stage adds the libraries it needs here when it lands.
analysis = ["torch>=2.4"]

[project.urls]
Repository = "https://github.com/vietnamesekid/ViTone"
Issues = "https://github.com/vietnamesekid/ViTone/issues"

[project.scripts]
vitone = "vitone.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "LOG", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
